<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title"><title id="title">生成结束、轮次结束和任务验收是不同边界</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#71896b" stroke-width="1.5"/></marker></defs><rect width="760" height="650" rx="22" fill="#eef1e8"/><g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="32" y="55" font-size="28" fill="#263d32" text-anchor="start">三个“结束”，回答三个不同的问题</text><rect x="32" y="100" width="696" height="138" rx="16" fill="#fff" stroke="#d3ddce"/><text x="55" y="141" font-size="28" fill="#263d32" text-anchor="start">模型生成结束</text><text x="55" y="182" font-size="24" fill="#263d32" text-anchor="start">这次请求是否收束？</text><text x="55" y="215" font-size="21" fill="#667760" text-anchor="start">可能还带着待执行的工具请求。</text><rect x="32" y="266" width="696" height="138" rx="16" fill="#fff" stroke="#d3ddce"/><text x="55" y="307" font-size="28" fill="#263d32" text-anchor="start">交互轮次结束</text><text x="55" y="348" font-size="24" fill="#263d32" text-anchor="start">本轮是否停止继续调用？</text><text x="55" y="381" font-size="21" fill="#667760" text-anchor="start">可能成功、失败、取消或预算耗尽。</text><rect x="32" y="432" width="696" height="138" rx="16" fill="#dae6d4" stroke="#d3ddce"/><text x="55" y="473" font-size="28" fill="#263d32" text-anchor="start">任务验收通过</text><text x="55" y="514" font-size="24" fill="#263d32" text-anchor="start">目标是否有证据地达成？</text><text x="55" y="547" font-size="21" fill="#667760" text-anchor="start">核对产物、要求与尚未解决的问题。</text><text x="32" y="620" font-size="21" fill="#667760" text-anchor="start">本轮停止以后，工作仍可能等待输入或下一次继续。</text></g></svg>