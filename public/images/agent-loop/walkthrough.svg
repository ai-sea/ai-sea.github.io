<svg xmlns="http://www.w3.org/2000/svg" width="760" height="850" viewBox="0 0 760 850" role="img" aria-labelledby="title"><title id="title">销售分析示例的六格执行分镜</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#71896b" stroke-width="1.5"/></marker></defs><rect width="760" height="850" rx="22" fill="#eef1e8"/><g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="32" y="52" font-size="29" fill="#263d32" text-anchor="start">同一个目标，经过三次模型判断</text><rect x="26" y="88" width="340" height="214" rx="16" fill="#dae6d4" stroke="#d3ddce"/><text x="46" y="130" font-size="23" fill="#4e6b50" text-anchor="start">01 / 用户</text><text x="46" y="186" font-size="23" fill="#263d32" text-anchor="start">读取销售数据并画统计图</text><text x="46" y="239" font-size="21" fill="#667760" text-anchor="start">完成后核对结果</text><path d="M370 196 H389" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><rect x="394" y="88" width="340" height="214" rx="16" fill="#fff" stroke="#d3ddce"/><text x="414" y="130" font-size="23" fill="#4e6b50" text-anchor="start">02 / 模型 → 工具</text><text x="414" y="186" font-size="23" fill="#263d32" text-anchor="start">read_sales()</text><text x="414" y="239" font-size="21" fill="#667760" text-anchor="start">请求读取，不是已经读取</text><rect x="26" y="328" width="340" height="214" rx="16" fill="#fff" stroke="#d3ddce"/><text x="46" y="370" font-size="23" fill="#4e6b50" text-anchor="start">03 / 工具 → 模型</text><text x="46" y="426" font-size="23" fill="#263d32" text-anchor="start">返回字段与数据引用</text><text x="46" y="479" font-size="21" fill="#667760" text-anchor="start">地区、金额、退货标记</text><path d="M370 436 H389" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><rect x="394" y="328" width="340" height="214" rx="16" fill="#fff" stroke="#d3ddce"/><text x="414" y="370" font-size="23" fill="#4e6b50" text-anchor="start">04 / 模型 → 工具</text><text x="414" y="426" font-size="23" fill="#263d32" text-anchor="start">summarize_and_plot()</text><text x="414" y="479" font-size="21" fill="#667760" text-anchor="start">按地区统计，剔除退货</text><rect x="26" y="568" width="340" height="214" rx="16" fill="#fff" stroke="#d3ddce"/><text x="46" y="610" font-size="23" fill="#4e6b50" text-anchor="start">05 / 工具 → 模型</text><text x="46" y="666" font-size="23" fill="#263d32" text-anchor="start">返回图表与核对数据</text><text x="46" y="719" font-size="21" fill="#667760" text-anchor="start">汇总值、行数、文件引用</text><path d="M370 676 H389" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><rect x="394" y="568" width="340" height="214" rx="16" fill="#dae6d4" stroke="#d3ddce"/><text x="414" y="610" font-size="23" fill="#4e6b50" text-anchor="start">06 / 模型 → 用户</text><text x="414" y="666" font-size="23" fill="#263d32" text-anchor="start">给出结果和统计口径</text><text x="414" y="719" font-size="21" fill="#667760" text-anchor="start">有证据后才声明完成</text><text x="32" y="822" font-size="20" fill="#667760" text-anchor="start">示意轨迹：展示可观察的请求与结果，不展示内部思维链。</text></g></svg>