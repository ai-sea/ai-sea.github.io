<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1160" viewBox="0 0 760 1160" role="img" aria-labelledby="title"><title id="title">语言模型推理、工具使用与运行机制的部分里程碑</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#71896b" stroke-width="1.5"/></marker></defs><rect width="760" height="1160" rx="22" fill="#eef1e8"/><g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="32" y="56" font-size="29" fill="#263d32" text-anchor="start">从一次生成，到根据反馈继续行动</text><text x="32" y="94" font-size="20" fill="#6b7964" text-anchor="start">选取部分节点 · 非完整历史，也非单一路线</text><path d="M135 140 L135 1040" stroke="#9eaf96" stroke-width="4"/><circle cx="135" cy="173" r="9" fill="#46644d"/><text x="112" y="179" font-size="20" fill="#46644d" text-anchor="end">2022.01</text><rect x="168" y="136" width="560" height="139" rx="16" fill="#fff" stroke="#d3ddce"/><text x="190" y="174" font-size="26" fill="#263d32" text-anchor="start">CoT</text><text x="190" y="214" font-size="23" fill="#263d32" text-anchor="start">用中间步骤辅助复杂推理</text><text x="190" y="247" font-size="20" fill="#667760" text-anchor="start">重点：怎样生成更好的判断</text><circle cx="135" cy="331" r="9" fill="#46644d"/><text x="112" y="337" font-size="20" fill="#46644d" text-anchor="end">2022.10</text><rect x="168" y="294" width="560" height="139" rx="16" fill="#fff" stroke="#d3ddce"/><text x="190" y="332" font-size="26" fill="#263d32" text-anchor="start">ReAct</text><text x="190" y="372" font-size="23" fill="#263d32" text-anchor="start">推理、行动与观察交替</text><text x="190" y="405" font-size="20" fill="#667760" text-anchor="start">重点：让环境反馈进入下一步</text><circle cx="135" cy="489" r="9" fill="#46644d"/><text x="112" y="495" font-size="20" fill="#46644d" text-anchor="end">2023.02</text><rect x="168" y="452" width="560" height="139" rx="16" fill="#fff" stroke="#d3ddce"/><text x="190" y="490" font-size="26" fill="#263d32" text-anchor="start">Toolformer</text><text x="190" y="530" font-size="23" fill="#263d32" text-anchor="start">自监督学习工具使用</text><text x="190" y="563" font-size="20" fill="#667760" text-anchor="start">重点：何时调用、如何利用结果</text><circle cx="135" cy="647" r="9" fill="#46644d"/><text x="112" y="653" font-size="20" fill="#46644d" text-anchor="end">2024.05</text><rect x="168" y="610" width="560" height="139" rx="16" fill="#fff" stroke="#d3ddce"/><text x="190" y="648" font-size="26" fill="#263d32" text-anchor="start">工具 API 的一个节点</text><text x="190" y="688" font-size="23" fill="#263d32" text-anchor="start">Claude 工具调用正式可用</text><text x="190" y="721" font-size="20" fill="#667760" text-anchor="start">接口表达请求，宿主执行工具</text><circle cx="135" cy="805" r="9" fill="#46644d"/><text x="112" y="811" font-size="20" fill="#46644d" text-anchor="end">2024.12</text><rect x="168" y="768" width="560" height="139" rx="16" fill="#fff" stroke="#d3ddce"/><text x="190" y="806" font-size="26" fill="#263d32" text-anchor="start">循环模式的工程归纳</text><text x="190" y="846" font-size="23" fill="#263d32" text-anchor="start">Building effective agents</text><text x="190" y="879" font-size="20" fill="#667760" text-anchor="start">强调环境反馈、人工介入与停止</text><circle cx="135" cy="963" r="9" fill="#46644d"/><text x="112" y="969" font-size="20" fill="#46644d" text-anchor="end">持续发展</text><rect x="168" y="926" width="560" height="139" rx="16" fill="#fff" stroke="#d3ddce"/><text x="190" y="964" font-size="26" fill="#263d32" text-anchor="start">运行系统 / Harness</text><text x="190" y="1004" font-size="23" fill="#263d32" text-anchor="start">上下文、恢复、评估与预算</text><text x="190" y="1037" font-size="20" fill="#667760" text-anchor="start">循环之外，还需要完整运行机制</text><text x="32" y="1125" font-size="19" fill="#667760" text-anchor="start">日期：论文初次提交 / 官方发布日期；持续发展项不设起点。</text></g></svg>