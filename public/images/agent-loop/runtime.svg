<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-labelledby="title"><title id="title">最小模型工具反馈循环与外围六项运行约束</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#71896b" stroke-width="1.5"/></marker></defs><rect width="760" height="760" rx="22" fill="#eef1e8"/><g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="32" y="54" font-size="29" fill="#263d32" text-anchor="start">循环很小，可靠运行需要外围规则</text><rect x="180" y="260" width="400" height="150" rx="16" fill="#dae6d4" stroke="#d3ddce"/><text x="380" y="317" font-size="29" fill="#263d32" text-anchor="middle">模型 → 工具 → 结果</text><text x="380" y="367" font-size="24" fill="#4e6b50" text-anchor="middle">↑ 根据反馈继续判断 ↵</text><rect x="28" y="100" width="212" height="110" rx="16" fill="#fff" stroke="#d3ddce"/><text x="134" y="145" font-size="26" fill="#263d32" text-anchor="middle">输入秩序</text><text x="134" y="185" font-size="21" fill="#667760" text-anchor="middle">排队与转向</text><path d="M134 214 V244" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><rect x="274" y="100" width="212" height="110" rx="16" fill="#fff" stroke="#d3ddce"/><text x="380" y="145" font-size="26" fill="#263d32" text-anchor="middle">工具边界</text><text x="380" y="185" font-size="21" fill="#667760" text-anchor="middle">校验与幂等</text><path d="M380 214 V244" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><rect x="520" y="100" width="212" height="110" rx="16" fill="#fff" stroke="#d3ddce"/><text x="626" y="145" font-size="26" fill="#263d32" text-anchor="middle">结束规则</text><text x="626" y="185" font-size="21" fill="#667760" text-anchor="middle">完成与退出</text><path d="M626 214 V244" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><rect x="28" y="494" width="212" height="110" rx="16" fill="#fff" stroke="#d3ddce"/><text x="134" y="539" font-size="26" fill="#263d32" text-anchor="middle">上下文预算</text><text x="134" y="579" font-size="21" fill="#667760" text-anchor="middle">选择与回读</text><path d="M134 420 V480" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><rect x="274" y="494" width="212" height="110" rx="16" fill="#fff" stroke="#d3ddce"/><text x="380" y="539" font-size="26" fill="#263d32" text-anchor="middle">中断恢复</text><text x="380" y="579" font-size="21" fill="#667760" text-anchor="middle">事实与续接</text><path d="M380 420 V480" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><rect x="520" y="494" width="212" height="110" rx="16" fill="#fff" stroke="#d3ddce"/><text x="626" y="539" font-size="26" fill="#263d32" text-anchor="middle">可观察性</text><text x="626" y="579" font-size="21" fill="#667760" text-anchor="middle">轨迹与评估</text><path d="M626 420 V480" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><text x="380" y="672" font-size="23" fill="#263d32" text-anchor="middle">先让最小闭环成立，再逐项验证真实环境中的边界。</text><text x="380" y="719" font-size="20" fill="#667760" text-anchor="middle">本文给出原理与问题地图，不宣称生产能力已完成。</text></g></svg>