<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img" aria-labelledby="title"><title id="title">从完整经历中按预算选择本次模型材料</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#71896b" stroke-width="1.5"/></marker></defs><rect width="760" height="640" rx="22" fill="#eef1e8"/><g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="32" y="54" font-size="28" fill="#263d32" text-anchor="start">模型读到的，是一次有预算的局部视图</text><rect x="32" y="96" width="696" height="126" rx="16" fill="#fff" stroke="#d3ddce"/><text x="55" y="138" font-size="28" fill="#263d32" text-anchor="start">完整记录与来源</text><text x="55" y="185" font-size="23" fill="#667760" text-anchor="start">用户要求 · 历史结果 · 文件正文 · 记忆与纠正</text><path d="M380 222 V260" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><rect x="130" y="272" width="500" height="125" rx="16" fill="#dae6d4" stroke="#d3ddce"/><text x="380" y="315" font-size="28" fill="#263d32" text-anchor="middle">选择 / 裁剪 / 按需回读</text><text x="380" y="364" font-size="23" fill="#667760" text-anchor="middle">相关性、来源、长度与总预算</text><path d="M380 397 V433" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><rect x="32" y="446" width="696" height="111" rx="16" fill="#fff" stroke="#d3ddce"/><text x="55" y="488" font-size="28" fill="#263d32" text-anchor="start">本次实际模型请求</text><text x="55" y="532" font-size="23" fill="#667760" text-anchor="start">保留必要要求、相关证据与工具结果引用</text><text x="32" y="607" font-size="21" fill="#667760" text-anchor="start">长工具输出留存原文与引用，不能把摘要当成唯一事实。</text></g></svg>