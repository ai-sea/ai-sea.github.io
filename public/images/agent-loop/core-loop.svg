<svg xmlns="http://www.w3.org/2000/svg" width="760" height="860" viewBox="0 0 760 860" role="img" aria-labelledby="title"><title id="title">最小 Agent Loop 的模型调用、工具执行与反馈路径</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#71896b" stroke-width="1.5"/></marker></defs><rect width="760" height="860" rx="22" fill="#eef1e8"/><g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="32" y="54" font-size="30" fill="#263d32" text-anchor="start">核心只有一条反馈路径</text><rect x="225" y="90" width="310" height="74" rx="16" fill="#fff" stroke="#d3ddce"/><text x="380" y="136" font-size="25" fill="#263d32" text-anchor="middle">用户目标 + 当前材料</text><path d="M380 164 V198" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><rect x="225" y="203" width="310" height="85" rx="16" fill="#dae6d4" stroke="#d3ddce"/><text x="380" y="254" font-size="30" fill="#263d32" text-anchor="middle">调用模型</text><path d="M380 288 V326" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><rect x="225" y="332" width="310" height="80" rx="16" fill="#fff" stroke="#d3ddce"/><text x="380" y="381" font-size="28" fill="#263d32" text-anchor="middle">解析输出</text><path d="M225 372 H160 V460" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><text x="117" y="433" font-size="22" fill="#667760" text-anchor="middle">工具请求</text><rect x="35" y="470" width="290" height="96" rx="16" fill="#fff" stroke="#d3ddce"/><text x="180" y="510" font-size="26" fill="#263d32" text-anchor="middle">宿主校验并执行</text><text x="180" y="544" font-size="19" fill="#667760" text-anchor="middle">模型不能直接越过边界</text><path d="M180 566 V609" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><rect x="35" y="620" width="290" height="84" rx="16" fill="#fff" stroke="#d3ddce"/><text x="180" y="671" font-size="26" fill="#263d32" text-anchor="middle">记录工具结果</text><path d="M180 704 V748 H742 V246 H541" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><text x="500" y="780" font-size="22" fill="#667760" text-anchor="middle">下一次请求读取新结果</text><path d="M535 372 H590 V460" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><text x="610" y="433" font-size="22" fill="#667760" text-anchor="middle">明确结束</text><rect x="435" y="470" width="290" height="96" rx="16" fill="#dae6d4" stroke="#d3ddce"/><text x="580" y="514" font-size="27" fill="#263d32" text-anchor="middle">返回最终结果</text><text x="580" y="548" font-size="20" fill="#667760" text-anchor="middle">终止本轮循环</text><text x="32" y="829" font-size="21" fill="#667760" text-anchor="start">异常、取消和预算耗尽走独立退出路径，不能当成成功。</text></g></svg>