<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title"><title id="title">消息到达、步骤接纳和实际请求的时间线</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#71896b" stroke-width="1.5"/></marker></defs><rect width="760" height="650" rx="22" fill="#eef1e8"/><g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="32" y="55" font-size="28" fill="#263d32" text-anchor="start">收到消息，不等于已经影响当前输出</text><text x="35" y="113" font-size="22" fill="#667760" text-anchor="start">时间</text><path d="M112 106 H710" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><rect x="110" y="150" width="250" height="88" rx="16" fill="#dae6d4" stroke="#d3ddce"/><text x="235" y="204" font-size="23" fill="#263d32" text-anchor="middle">步骤 1：请求已发出</text><rect x="456" y="150" width="270" height="88" rx="16" fill="#dae6d4" stroke="#d3ddce"/><text x="591" y="204" font-size="23" fill="#263d32" text-anchor="middle">步骤 2：使用新要求</text><path d="M370 194 H445" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><path d="M405 127 V550" stroke="#9eaf96" stroke-dasharray="6 6" stroke-width="2"/><text x="405" y="278" font-size="22" fill="#667760" text-anchor="middle">接纳边界</text><rect x="30" y="310" width="330" height="120" rx="16" fill="#fff" stroke="#d3ddce"/><text x="50" y="353" font-size="25" fill="#263d32" text-anchor="start">途中收到：排除退货</text><text x="50" y="395" font-size="21" fill="#667760" text-anchor="start">先保存，不改已发出的请求</text><path d="M360 370 H405 V244" stroke="#71896b" stroke-width="3" fill="none"  marker-end="url(#a)"/><rect x="456" y="310" width="270" height="120" rx="16" fill="#fff" stroke="#d3ddce"/><text x="476" y="353" font-size="25" fill="#263d32" text-anchor="start">在下一步接纳</text><text x="476" y="395" font-size="21" fill="#667760" text-anchor="start">固定新的请求材料</text><rect x="30" y="474" width="696" height="100" rx="16" fill="#fff" stroke="#d3ddce"/><text x="50" y="516" font-size="25" fill="#263d32" text-anchor="start">普通排队消息 → 等待开启下一轮</text><text x="50" y="553" font-size="22" fill="#667760" text-anchor="start">转向消息 → 在合法步骤边界影响当前轮次</text><text x="32" y="618" font-size="20" fill="#667760" text-anchor="start">这是本文采用的一种输入设计，其他系统可选择不同策略。</text></g></svg>