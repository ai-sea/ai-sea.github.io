<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title"><title id="title">从运行骨架到责任、记忆与协作的逐步验证路线</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6b8668" stroke-width="1.5"/></marker></defs><rect width="960" height="520" rx="24" fill="#eef1e8"/><g font-family="system-ui, Microsoft YaHei, sans-serif"><text x="40" y="56" fill="#263b32" font-size="30" text-anchor="start">从小处验证，再向长期能力走</text><rect x="40" y="112" width="190" height="268" rx="18" fill="#dce7d7" stroke="#d4ddcf"/><text x="62" y="167" fill="#6b8668" font-size="42" text-anchor="start">01</text><text x="62" y="227" fill="#263b32" font-size="24" text-anchor="start">运行骨架</text><text x="62" y="276" fill="#64765f" font-size="17" text-anchor="start">身份 · 消息 · 模型</text><text x="62" y="340" fill="#64765f" font-size="17" text-anchor="start">逐项实现与验证</text><path d="M235 245 L260 245" fill="none" stroke="#6b8668" stroke-width="3"  marker-end="url(#arrow)"/><rect x="270" y="112" width="190" height="268" rx="18" fill="#fff" stroke="#d4ddcf"/><text x="292" y="167" fill="#6b8668" font-size="42" text-anchor="start">02</text><text x="292" y="227" fill="#263b32" font-size="24" text-anchor="start">持续工作</text><text x="292" y="276" fill="#64765f" font-size="17" text-anchor="start">责任 · 工具 · 验收</text><text x="292" y="340" fill="#64765f" font-size="17" text-anchor="start">逐项实现与验证</text><path d="M465 245 L490 245" fill="none" stroke="#6b8668" stroke-width="3"  marker-end="url(#arrow)"/><rect x="500" y="112" width="190" height="268" rx="18" fill="#fff" stroke="#d4ddcf"/><text x="522" y="167" fill="#6b8668" font-size="42" text-anchor="start">03</text><text x="522" y="227" fill="#263b32" font-size="24" text-anchor="start">认知连续</text><text x="522" y="276" fill="#64765f" font-size="17" text-anchor="start">经历 · 记忆 · 纠正</text><text x="522" y="340" fill="#64765f" font-size="17" text-anchor="start">逐项实现与验证</text><path d="M695 245 L720 245" fill="none" stroke="#6b8668" stroke-width="3"  marker-end="url(#arrow)"/><rect x="730" y="112" width="190" height="268" rx="18" fill="#fff" stroke="#d4ddcf"/><text x="752" y="167" fill="#6b8668" font-size="42" text-anchor="start">04</text><text x="752" y="227" fill="#263b32" font-size="24" text-anchor="start">多主体协作</text><text x="752" y="276" fill="#64765f" font-size="17" text-anchor="start">协商 · 空间 · 回归</text><text x="752" y="340" fill="#64765f" font-size="17" text-anchor="start">逐项实现与验证</text><text x="480" y="445" fill="#263b32" font-size="23" text-anchor="middle">每一阶段都要回答：是否可靠？是否减少了用户负担？</text><text x="480" y="486" fill="#64765f" font-size="19" text-anchor="middle">路线表达实施顺序，不代表这些能力已经完成。</text></g></svg>