<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title"><title id="title">围绕 Bot 连接入口、工作、记忆和工具</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6b8668" stroke-width="1.5"/></marker></defs><rect width="960" height="520" rx="24" fill="#eef1e8"/><g font-family="system-ui, Microsoft YaHei, sans-serif"><text x="40" y="55" fill="#263b32" font-size="30" text-anchor="start">把连续性放在中间</text><rect x="40" y="98" width="252" height="105" rx="18" fill="#fff" stroke="#d4ddcf"/><text x="166" y="139" fill="#263b32" font-size="25" text-anchor="middle">聊天 · 桌面</text><text x="166" y="176" fill="#64765f" font-size="19" text-anchor="middle">沟通入口</text><rect x="40" y="315" width="252" height="105" rx="18" fill="#fff" stroke="#d4ddcf"/><text x="166" y="356" fill="#263b32" font-size="25" text-anchor="middle">模型 · 外部工具</text><text x="166" y="393" fill="#64765f" font-size="19" text-anchor="middle">判断与执行能力</text><rect x="345" y="182" width="270" height="150" rx="18" fill="#3e5d49" stroke="#3e5d49"/><text x="480" y="243" fill="#fff" font-size="44" text-anchor="middle">Bot</text><text x="480" y="293" fill="#e0ead9" font-size="21" text-anchor="middle">持续身份 · 当前注意力</text><rect x="668" y="98" width="252" height="105" rx="18" fill="#fff" stroke="#d4ddcf"/><text x="794" y="139" fill="#263b32" font-size="25" text-anchor="middle">责任与进展</text><text x="794" y="176" fill="#64765f" font-size="19" text-anchor="middle">承诺、验收、未完项</text><rect x="668" y="315" width="252" height="105" rx="18" fill="#fff" stroke="#d4ddcf"/><text x="794" y="356" fill="#263b32" font-size="25" text-anchor="middle">经历与记忆</text><text x="794" y="393" fill="#64765f" font-size="19" text-anchor="middle">来源、变化、纠正</text><path d="M292 151 L340 216" fill="none" stroke="#6b8668" stroke-width="3"  marker-end="url(#arrow)"/><path d="M345 299 L297 359" fill="none" stroke="#6b8668" stroke-width="3"  marker-end="url(#arrow)"/><path d="M615 216 L662 151" fill="none" stroke="#6b8668" stroke-width="3"  marker-end="url(#arrow)"/><path d="M615 299 L662 359" fill="none" stroke="#6b8668" stroke-width="3"  marker-end="url(#arrow)"/><text x="480" y="480" fill="#64765f" font-size="23" text-anchor="middle">入口和工具可以更换，工作的归属仍要连贯。</text></g></svg>