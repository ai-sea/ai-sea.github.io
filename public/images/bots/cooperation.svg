<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title"><title id="title">独立 Bot 协商合作，分身回归交还经历与责任</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6b8668" stroke-width="1.5"/></marker></defs><rect width="960" height="520" rx="24" fill="#eef1e8"/><g font-family="system-ui, Microsoft YaHei, sans-serif"><text x="40" y="54" fill="#263b32" font-size="30" text-anchor="start">两种关系，两种交接</text><rect x="35" y="88" width="430" height="370" rx="18" fill="#fff" stroke="#d4ddcf"/><rect x="495" y="88" width="430" height="370" rx="18" fill="#fff" stroke="#d4ddcf"/><text x="64" y="132" fill="#263b32" font-size="25" text-anchor="start">独立 Bot：协商合作</text><text x="524" y="132" fill="#263b32" font-size="23" text-anchor="start">同一身份的分身：分化与回归</text><rect x="65" y="174" width="130" height="85" rx="18" fill="#dce7d7" stroke="#d4ddcf"/><text x="130" y="226" fill="#263b32" font-size="25" text-anchor="middle">Bot A</text><rect x="305" y="174" width="130" height="85" rx="18" fill="#dce7d7" stroke="#d4ddcf"/><text x="370" y="226" fill="#263b32" font-size="25" text-anchor="middle">Bot B</text><path d="M201 204 L299 204" fill="none" stroke="#6b8668" stroke-width="3"  marker-end="url(#arrow)"/><path d="M299 234 L201 234" fill="none" stroke="#6b8668" stroke-width="3"  marker-end="url(#arrow)"/><text x="250" y="294" fill="#263b32" font-size="22" text-anchor="middle">澄清 · 接单 · 反馈</text><text x="250" y="346" fill="#64765f" font-size="21" text-anchor="middle">通过消息和公开材料协作</text><text x="250" y="390" fill="#64765f" font-size="21" text-anchor="middle">各自保留私有经历</text><rect x="524" y="174" width="140" height="85" rx="18" fill="#dce7d7" stroke="#d4ddcf"/><text x="594" y="226" fill="#263b32" font-size="24" text-anchor="middle">主实例</text><rect x="756" y="174" width="140" height="85" rx="18" fill="#dce7d7" stroke="#d4ddcf"/><text x="826" y="226" fill="#263b32" font-size="24" text-anchor="middle">分身</text><path d="M669 204 L749 204" fill="none" stroke="#6b8668" stroke-width="3"  marker-end="url(#arrow)"/><path d="M749 234 L669 234" fill="none" stroke="#6b8668" stroke-width="3"  marker-end="url(#arrow)"/><text x="710" y="294" fill="#263b32" font-size="22" text-anchor="middle">带回结论，也带回过程</text><text x="710" y="346" fill="#64765f" font-size="21" text-anchor="middle">经历 · 记忆变化 · 未决问题</text><text x="710" y="390" fill="#64765f" font-size="21" text-anchor="middle">未完工作与责任</text><text x="480" y="495" fill="#64765f" font-size="19" text-anchor="middle">以上是待验证的设计目标。</text></g></svg>