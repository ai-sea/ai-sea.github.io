<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title"><title id="title">跨越对话、工具和等待，让工作继续</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#6b8668" stroke-width="1.5"/></marker></defs><rect width="960" height="520" rx="24" fill="#eef1e8"/><g font-family="system-ui, Microsoft YaHei, sans-serif"><text x="40" y="56" fill="#263b32" font-size="30" text-anchor="start">我们想解决的，是中间这些衔接</text><rect x="40" y="100" width="190" height="144" rx="18" fill="#fff" stroke="#d4ddcf"/><text x="62" y="140" fill="#64765f" font-size="18" text-anchor="start">今天</text><text x="62" y="190" fill="#263b32" font-size="24" text-anchor="start">提出目标</text><path d="M235 172 L260 172" fill="none" stroke="#6b8668" stroke-width="3"  marker-end="url(#arrow)"/><rect x="270" y="100" width="190" height="144" rx="18" fill="#fff" stroke="#d4ddcf"/><text x="292" y="140" fill="#64765f" font-size="18" text-anchor="start">执行中</text><text x="292" y="190" fill="#263b32" font-size="24" text-anchor="start">使用工具</text><path d="M465 172 L490 172" fill="none" stroke="#6b8668" stroke-width="3"  marker-end="url(#arrow)"/><rect x="500" y="100" width="190" height="144" rx="18" fill="#fff" stroke="#d4ddcf"/><text x="522" y="140" fill="#64765f" font-size="18" text-anchor="start">等待时</text><text x="522" y="190" fill="#263b32" font-size="24" text-anchor="start">保留未完项</text><path d="M695 172 L720 172" fill="none" stroke="#6b8668" stroke-width="3"  marker-end="url(#arrow)"/><rect x="730" y="100" width="190" height="144" rx="18" fill="#fff" stroke="#d4ddcf"/><text x="752" y="140" fill="#64765f" font-size="18" text-anchor="start">第二天</text><text x="752" y="190" fill="#263b32" font-size="24" text-anchor="start">核对并继续</text><rect x="40" y="300" width="880" height="164" rx="18" fill="#3e5d49" stroke="#3e5d49"/><text x="70" y="342" fill="#fff" font-size="28" text-anchor="start">同一个 Bot，接住同一件事</text><text x="70" y="389" fill="#e0ead9" font-size="24" text-anchor="start">目标是什么？  做到哪里？  还缺什么？  下一步找谁？</text><text x="70" y="433" fill="#d3dfce" font-size="20" text-anchor="start">设计目标：得到必要授权与条件后，继续推进</text><path d="M135 250 L135 288" fill="none" stroke="#6b8668" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/><path d="M365 250 L365 288" fill="none" stroke="#6b8668" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/><path d="M595 250 L595 288" fill="none" stroke="#6b8668" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/><path d="M825 250 L825 288" fill="none" stroke="#6b8668" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/></g></svg>